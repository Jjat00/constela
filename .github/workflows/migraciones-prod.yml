# Aplica migraciones pendientes a la BD de producción en cada push a main.
# Solo corre si el push toca supabase/migrations/ (y db push es idempotente:
# aplica únicamente las migraciones que producción aún no tiene).
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   — token personal (https://supabase.com/dashboard/account/tokens)
#   PRODUCTION_PROJECT_ID   — ref del proyecto (Settings → General en el dashboard)
#   PRODUCTION_DB_PASSWORD  — contraseña de la BD del proyecto

name: Migraciones a producción

on:
  push:
    branches:
      - main
    paths:
      - supabase/migrations/**
  workflow_dispatch:

jobs:
  migrar:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref $SUPABASE_PROJECT_ID
      - run: supabase db push
